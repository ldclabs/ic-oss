<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Video tool</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 20px auto;
      padding: 20px;
    }

    #video-container {
      margin: 20px 0;
    }

    #status {
      color: #666;
      font-size: 0.9em;
    }

    #httpHeaders {
      white-space: pre-wrap;
    }
  </style>
</head>

<body>
  <h1>Video tool</h1>

  <div>
    <input type="url" id="videoUrl" aria-label="Video URL" placeholder="Enter a video URL"
      value="https://mmrxu-fqaaa-aaaap-ahhna-cai.icp0.io/f/3?inline" style="width: 70%; padding: 8px">
    <button onclick="loadVideo()">Load video</button>
  </div>

  <div id="video-container">
    <video id="myVideo" preload="metadata" controls width="100%">
      Your browser does not support the video tag.
    </video>
  </div>

  <div id="status">
    <h3>Video information</h3>
    <p id="metaData"></p>
    <p id="httpHeaders"></p>
  </div>

  <script>
    const video = document.getElementById('myVideo')
    const videoUrl = document.getElementById('videoUrl')
    const metaData = document.getElementById('metaData')
    const httpHeaders = document.getElementById('httpHeaders')
    let headerRequest

    video.addEventListener('loadedmetadata', () => {
      metaData.textContent = `${video.duration.toFixed(2)} seconds, ${video.videoWidth} × ${video.videoHeight}`
    })
    video.addEventListener('error', () => {
      metaData.textContent = 'Could not load the video.'
    })

    function loadVideo() {
      const source = videoUrl.value.trim()
      if (!source || !videoUrl.reportValidity()) return
      headerRequest?.abort()
      headerRequest = new AbortController()
      const { signal } = headerRequest
      metaData.textContent = ''
      httpHeaders.textContent = ''
      video.src = source

      fetch(source, { method: 'HEAD', signal })
        .then(response => {
          const headers = Array.from(response.headers, ([name, value]) => `${name}: ${value}`)
          httpHeaders.textContent = [`HTTP ${response.status}`, ...headers].join('\n')
        })
        .catch(() => {
          if (!signal.aborted) httpHeaders.textContent = 'Could not read the HTTP headers.'
        })
    }
  </script>
</body>

</html>
